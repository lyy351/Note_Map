<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学习笔记 · 首页</title>
  <style>
    /* 完全保留你的卡片样式，无任何改动 */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh;
      background:#f1f5e7;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:0 1rem 2rem;
    }
    .header {
      width:100%;
      max-width:800px;
      display:flex;
      justify-content:space-between;
      font-size:0.85rem;
      font-weight:500;
      color:#fc5204;
      letter-spacing:0.1em;
      text-transform:uppercase;
      padding:0 0.2rem;
      margin-bottom:1.5rem;
      margin-top:0.5rem;
    }
    .card {
      width:210px;
      height:254px;
      border-radius:4px;
      background:#f1f5e7;
      display:flex;
      gap:5px;
      padding:0.4em;
      box-shadow:0 8px 20px rgba(0,0,0,0.04);
      margin-top:1rem;
    }
    .card p {
      height:100%;
      flex:1;
      overflow:hidden;
      cursor:pointer;
      border-radius:2px;
      transition:all 0.5s;
      background:#f1f5e7;
      border:1px solid #fc5204;
      display:flex;
      justify-content:center;
      align-items:center;
      margin:0;
    }
    .card p:hover { flex:4; }
    .card p span {
      min-width:14em;
      padding:0.5em;
      text-align:center;
      transform:rotate(-90deg);
      transition:all 0.5s;
      text-transform:uppercase;
      color:#fc5204;
      letter-spacing:0.1em;
      font-size:0.85rem;
      font-weight:500;
      white-space:nowrap;
    }
    .card p:hover span { transform:rotate(0); }
    .card-wrapper {
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      flex:1;
    }
    @media (max-width:480px) {
      .card { transform:scale(0.85); }
      .header { font-size:0.75rem; }
      .card p span { font-size:0.75rem; }
    }
  </style>
</head>
<body>
  <div class="header"><span>学</span><span>习</span><span>笔</span><span>记</span></div>
  <div class="card-wrapper">
    <div class="card">
      <p onclick="location.href='painting-route.html'"><span>绘画路线</span></p>
      <p onclick="location.href='painting-free.html'"><span>绘画随意</span></p>
      <p onclick="location.href='female.html'"><span>女性</span></p>
      <p onclick="location.href='literary-theory.html'"><span>文学理论</span></p>
      <p onclick="location.href='others.html'"><span>其他</span></p>
    </div>
  </div>
</body>
</html>
