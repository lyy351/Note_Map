<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>绘画路线 · 学习笔记</title>
  <style>
    /* ===== 你提供的 LineSidebar 完整 CSS（原封不动） ===== */
    .line-sidebar {
      --accent-color: #fc5204;
      --text-color: #333;
      --marker-color: #aaa;
      --marker-length: 60px;
      --marker-gap: 0px;
      --tick-scale: 0.5;
      --max-shift: 30px;
      --item-gap: 20px;
      --font-size: 1.1rem;
      --smoothing: 100ms;
      position: relative;
      display: flex;
      justify-content: flex-start;
    }
    .line-sidebar--markers {
      padding-left: calc(var(--marker-length) + var(--marker-gap));
    }
    .line-sidebar__list {
      list-style: none;
      margin: 0;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: var(--item-gap);
    }
    .line-sidebar__item {
      position: relative;
      cursor: pointer;
      --effect: 0;
    }
    .line-sidebar__item::before {
      content: '';
      position: absolute;
      inset: -6px -48px;
    }
    .line-sidebar__label {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      font-size: var(--font-size);
      line-height: 1.2;
      color: color-mix(in srgb, var(--accent-color) calc(var(--effect, 0) * 100%), var(--text-color));
      transform: translateX(calc(var(--effect, 0) * var(--max-shift)));
      transition: none;
    }
    .line-sidebar__index {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-right: 0.6rem;
      font-size: 0.85em;
      opacity: calc(0.55 + var(--effect, 0) * 0.45);
    }
    .line-sidebar__marker {
      position: absolute;
      top: 50%;
      left: calc(-1 * var(--marker-length) - var(--marker-gap));
      height: 1px;
      width: var(--marker-length);
      background-color: color-mix(in srgb, var(--accent-color) calc(var(--effect, 0) * 100%), var(--marker-color));
      transform-origin: left center;
      transform: translateY(-50%) scaleX(calc(0.7 + var(--effect, 0) * 0.5));
    }
    .line-sidebar--markers .line-sidebar__item:not(:last-child)::after {
      content: '';
      position: absolute;
      top: calc(100% + var(--item-gap) / 2);
      left: calc(-1 * var(--marker-length) - var(--marker-gap));
      height: 1px;
      width: calc(var(--marker-length) * var(--tick-scale));
      background-color: var(--marker-color);
      opacity: 0.5;
      transform-origin: left center;
      transform: translateY(-50%) scaleX(calc(0.7 + var(--effect, 0) * 0.6));
    }

    /* ===== 页面布局 ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #f1f5e7;
      font-family: system-ui, sans-serif;
      padding: 2rem;
    }
    .detail-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 3rem;
      align-items: flex-start;
    }
    .sidebar-wrapper {
      flex: 0 0 260px;
      padding-top: 0.5rem;
    }
    .content-area {
      flex: 1;
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      min-height: 500px;
    }
    .content-area h1 {
      font-size: 2rem;
      color: #2c3e2b;
      margin-bottom: 0.3rem;
    }
    .content-area .meta {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #eee;
    }
    .content-area .notes {
      line-height: 1.8;
    }
    .content-area .notes img {
      max-width: 100%;
      border-radius: 8px;
      margin: 0.5rem 0;
    }
    .content-area .notes table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.5rem 0;
    }
    .content-area .notes th, .content-area .notes td {
      border: 1px solid #ccc;
      padding: 0.4rem 0.6rem;
    }
    .content-area .notes blockquote {
      background: #f9f9f9;
      padding: 0.8rem 1rem;
      border-left: 4px solid #fc5204;
      margin: 0.5rem 0;
    }
    .back-home {
      display: inline-block;
      margin-bottom: 1rem;
      color: #fc5204;
      text-decoration: none;
      font-weight: 500;
    }
    .back-home:hover { text-decoration:underline; }

    @media (max-width: 640px) {
      .detail-container { flex-direction: column; gap:1rem; }
      .sidebar-wrapper { flex:none; width:100%; }
      .line-sidebar--markers { padding-left:0; }
      .line-sidebar__marker,
      .line-sidebar--markers .line-sidebar__item:not(:last-child)::after { display:none; }
    }
  </style>
</head>
<body>
  <div class="detail-container">
    <!-- 侧边栏 -->
    <aside class="sidebar-wrapper">
      <nav class="line-sidebar line-sidebar--markers" id="lineSidebar">
        <ul class="line-sidebar__list" id="sidebarList"></ul>
      </nav>
    </aside>

    <!-- 内容区 -->
    <main class="content-area" id="contentArea">
      <a href="index.html" class="back-home">← 返回首页</a>
      <div id="contentInner"></div>
    </main>
  </div>

  <!-- 引入数据文件 -->
  <script src="data.js"></script>
  <script>
    (function() {
      // ===== 1. 定义当前栏目ID =====
      const categoryId = 'painting-route';  // 对应 data.js 中的键名

      // 从数据中获取该栏目的条目列表
      const items = APP_DATA.items[categoryId] || [];
      if (items.length === 0) {
        document.getElementById('contentInner').innerHTML = '<p>该栏目暂无笔记条目。</p>';
        return;
      }

      // ===== 2. 状态 =====
      let activeIndex = 0;

      // ===== 3. 渲染侧边栏 =====
      const sidebarList = document.getElementById('sidebarList');
      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'line-sidebar__item';
        li.dataset.index = index;

        const marker = document.createElement('span');
        marker.className = 'line-sidebar__marker';
        marker.setAttribute('aria-hidden', 'true');
        li.appendChild(marker);

        const labelSpan = document.createElement('span');
        labelSpan.className = 'line-sidebar__label';

        const idxSpan = document.createElement('span');
        idxSpan.className = 'line-sidebar__index';
        idxSpan.textContent = String(index + 1).padStart(2, '0');
        labelSpan.appendChild(idxSpan);

        const textSpan = document.createElement('span');
        textSpan.className = 'line-sidebar__text';
        textSpan.textContent = item.title;
        labelSpan.appendChild(textSpan);

        li.appendChild(labelSpan);
        sidebarList.appendChild(li);

        li.addEventListener('click', function() {
          const idx = parseInt(this.dataset.index);
          setActiveItem(idx);
        });
      });

      // ===== 4. 更新右侧内容 =====
      function renderContent(index) {
        const item = items[index];
        if (!item) return;

        const inner = document.getElementById('contentInner');
        let metaHtml = '';
        if (item.author) metaHtml += `<span>作者：${item.author}</span>`;
        if (item.director) metaHtml += `<span>导演：${item.director}</span>`;
        if (item.publisher) metaHtml += ` · ${item.publisher}`;
        if (item.year) metaHtml += ` (${item.year})`;
        if (item.cover) {
          // 将封面图放在右上角
          metaHtml = `<img src="${item.cover}" alt="${item.title}" style="max-height:200px;border-radius:8px;float:right;margin-left:1rem;margin-bottom:0.5rem;">` + metaHtml;
        }

        inner.innerHTML = `
          <h1>${item.title}</h1>
          <div class="meta">${metaHtml}</div>
          <div class="notes">${item.notes || '<p style="color:#999;">暂无笔记内容。</p>'}</div>
        `;
      }

      // ===== 5. 切换激活项 =====
      function setActiveItem(index) {
        activeIndex = index;
        // 更新侧边栏高亮（aria-current 和 --effect）
        const allItems = sidebarList.querySelectorAll('.line-sidebar__item');
        allItems.forEach((el, i) => {
          el.setAttribute('aria-current', i === activeIndex ? 'true' : 'false');
          el.style.setProperty('--effect', i === activeIndex ? '1' : '0');
        });
        renderContent(activeIndex);
        // 重启侧边栏动效循环，让激活项保持高亮
        if (window._restartSidebar) window._restartSidebar();
      }

      // 默认选中第一个
      setActiveItem(0);

      // ===== 6. LineSidebar 动效（原生 JS，完整保留） =====
      const listEl = document.getElementById('sidebarList');
      let itemEls = [];
      let targets = [];
      let currents = [];
      let rafId = null;
      let lastTime = 0;
      const smoothing = 100;
      const proximityRadius = 100;
      const falloff = 'smooth';

      function easeSmooth(p) { return p * p * (3 - 2 * p); }
      function easeLinear(p) { return p; }
      function getEase(type) { return type === 'smooth' ? easeSmooth : easeLinear; }

      function updateItemRefs() {
        itemEls = Array.from(listEl.querySelectorAll('.line-sidebar__item'));
        const len = itemEls.length;
        while (targets.length < len) targets.push(0);
        while (currents.length < len) currents.push(0);
        while (targets.length > len) { targets.pop(); currents.pop(); }
        // 初始值：激活项为1，其余0
        targets.forEach((_, i) => {
          targets[i] = (i === activeIndex) ? 1 : 0;
          currents[i] = (i === activeIndex) ? 1 : 0;
        });
        itemEls.forEach((el, i) => {
          el.style.setProperty('--effect', currents[i].toFixed(4));
        });
      }

      function animateSidebar(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;
        const tau = Math.max(smoothing, 1) / 1000;
        const k = 1 - Math.exp(-dt / tau);
        const ease = getEase(falloff);

        let moving = false;
        itemEls.forEach((el, i) => {
          const activeBonus = (i === activeIndex) ? 1 : 0;
          const target = Math.max(targets[i] || 0, activeBonus);
          const cur = currents[i] || 0;
          const next = cur + (target - cur) * k;
          const settled = Math.abs(target - next) < 0.0015;
          const value = settled ? target : next;
          currents[i] = value;
          el.style.setProperty('--effect', value.toFixed(4));
          if (!settled) moving = true;
        });

        rafId = moving ? requestAnimationFrame(animateSidebar) : null;
      }

      function startSidebarAnimation() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        lastTime = 0;
        updateItemRefs();
        rafId = requestAnimationFrame(animateSidebar);
      }

      // 暴露重启方法
      window._restartSidebar = startSidebarAnimation;

      // 鼠标事件
      function onPointerMove(e) {
        const rect = listEl.getBoundingClientRect();
        const pointerY = e.clientY - rect.top;
        const ease = getEase(falloff);
        itemEls.forEach((el, i) => {
          const center = el.offsetTop + el.offsetHeight / 2;
          const distance = Math.abs(pointerY - center);
          const raw = Math.max(0, 1 - distance / proximityRadius);
          targets[i] = ease(raw);
        });
        if (!rafId) { lastTime = 0; rafId = requestAnimationFrame(animateSidebar); }
      }

      function onPointerLeave() {
        itemEls.forEach((_, i) => { targets[i] = 0; });
        if (!rafId) { lastTime = 0; rafId = requestAnimationFrame(animateSidebar); }
      }

      listEl.addEventListener('pointermove', onPointerMove);
      listEl.addEventListener('pointerleave', onPointerLeave);

      startSidebarAnimation();

      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && !rafId) {
          lastTime = 0;
          rafId = requestAnimationFrame(animateSidebar);
        }
      });

    })();
  </script>
</body>
</html>
